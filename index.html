<style>:root{--teal:#2cbdc2;--teal2:#d6f3f4;--tealD:#1c9a9f;--line:#dfe8e9;--bg:#f2f6f6;--ink:#222a2b;--muted:#7f8c8d}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header.top{min-height:56px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}

.form{overflow:auto;padding:18px 18px 60px;border-right:1px solid var(--line);background:#fff}
.preview{overflow:auto;padding:24px;display:flex;justify-content:safe center;align-items:flex-start;position:relative}

.sec h2 .num{background:var(--teal);color:#fff;border-radius:20px;padding:1px 10px;font-size:12.5px}

.row{display:flex;gap:10px;align-items:center}
.rte{border:1px solid #cfdcdd;border-radius:8px;padding:9px 10px;min-height:96px;max-height:340px;overflow:auto;line-height:1.6;white-space:pre-wrap;word-break:break-all;background:#fff}
.rte.sm{min-height:44px}

.avs{display:flex;gap:14px;padding:5px}
.av{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#4b5a5c;cursor:pointer;background:none;border:none;padding:0;font-family:inherit}

.addrow{display:flex;gap:8px;margin-top:8px}

.checks{border:2px solid var(--line);border-radius:14px;padding:14px;margin-top:16px;background:#fff}

.chk.err .ic{background:#e5484d}.chk.warn .ic{background:#f5a524}.chk.ok .ic{background:#30a46c}.chk.info .ic{background:#3b82f6}

.pill{border-radius:20px;padding:1px 9px;font-size:12px;font-weight:700;color:#fff}
.pill.err{background:#e5484d}.pill.warn{background:#f5a524}.pill.ok{background:#30a46c}.pill.info{background:#3b82f6}

.flash{animation:fl 1.4s}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#222a2b;color:#fff;padding:11px 20px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:80vw}

.zipwrap{position:relative}

<header class="top">
  <h1>홈런 중등 고민있어요 제작 도구</h1>

const F_BODY='"NanumHuman Light","NanumHuman","나눔휴먼 Light","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const F_BOLD='"NanumHuman","NanumHuman Bold","나눔휴먼 Bold","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const F_REG='"NanumHuman Regular","NanumHuman","나눔휴먼 Regular","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const F_XB='"NanumHuman ExtraBold","NanumHuman","나눔휴먼 ExtraBold","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const F_TITLE='"KoreanSWGIG4R","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const probe=document.createElement('canvas').getContext('2d');
function hasFont(name,weight){ const t='가나다ABCabc123한글',w=weight||400;
  probe.font=`${w} 40px "${name}", monospace`; const a=probe.measureText(t).width;
  probe.font=`${w} 40px "${name}", serif`; const b=probe.measureText(t).width; return a===b; }
const fontState={title:false,light:false,bold:false,reg:false,xb:false};
const NH_LIGHT=['NanumHuman Light','NanumHuman-Light','NanumHumanLight','나눔휴먼 Light','나눔휴먼 L','NanumHuman TTF Light','NanumHumanTTF Light','NanumHumanTTF-Light','NanumHuman L','NanumHuman-L'];
const NH_BOLD=['NanumHuman Bold','NanumHuman-Bold','NanumHumanBold','나눔휴먼 Bold','나눔휴먼 B','NanumHuman TTF Bold','NanumHumanTTF Bold','NanumHumanTTF-Bold','NanumHuman ExtraBold','NanumHuman B','NanumHuman-B'];
const NH_REG=['NanumHuman Regular','NanumHuman-Regular','NanumHumanRegular','나눔휴먼 Regular','나눔휴먼','NanumHuman TTF','NanumHumanTTF','NanumHuman TTF Regular','NanumHumanTTF Regular','NanumHuman'];
const NH_XB=['NanumHuman ExtraBold','NanumHuman-ExtraBold','NanumHumanExtraBold','나눔휴먼 ExtraBold','NanumHuman TTF ExtraBold','NanumHumanTTF ExtraBold','NanumHumanTTF-ExtraBold','NanumHuman Extra Bold'];
const NH_TITLE=['KoreanSWGIG4R','Korean SWGIG4R','KoreanSWGIG4R-Regular','KoreanSWGIG4R Regular'];
async function tryLocal(names,alias,weight){ for(const n of names){ try{ const f=new FontFace(alias,`local("${n}")`,{weight:String(weight)}); await f.load(); document.fonts.add(f); return true; }catch(e){} } return false; }
async function detectFonts(){
  fontState.title=hasFont('KoreanSWGIG4R',400)||await tryLocal(NH_TITLE,'KoreanSWGIG4R',400);
  fontState.light=hasFont('NanumHuman Light',300)||await tryLocal(NH_LIGHT,'NanumHuman Light',300);
  fontState.bold=hasFont('NanumHuman',700)||await tryLocal(NH_BOLD,'NanumHuman',700);
  fontState.reg=hasFont('NanumHuman Regular',400)||await tryLocal(NH_REG,'NanumHuman Regular',400);
  fontState.xb=hasFont('NanumHuman ExtraBold',800)||await tryLocal(NH_XB,'NanumHuman ExtraBold',800);
  wcache.clear(); for(const k in fm) delete fm[k]; }
const bodyFont=b=> b ? '700|'+F_BOLD : '300|'+F_BODY;
const titleFont=()=> (fontState.title?'400|':'800|')+F_TITLE;
const boldFont=()=>'700|'+F_BOLD;
const tealFont=bodyFont;
// 사용자가 불러온 폰트 파일을 IndexedDB에 보관
const FDB={ open(){ return new Promise((res,rej)=>{ const r=indexedDB.open('gomin-mid-fonts',1); r.onupgradeneeded=()=>r.result.createObjectStore('f'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },

      return;
    }
    if(n.nodeType!==1) return;
    const tag=n.tagName.toUpperCase();
    if(SKIP.test(tag)) return;
    if(tag==='BR'){ nl(); return; }
    const block=/^(DIV|P|LI|H[1-6]|TR|BLOCKQUOTE|SECTION|ARTICLE|UL|OL|TABLE)$/.test(tag);
    let nb=b; const fw=n.style&&n.style.fontWeight;
    if(fw){ const bd=fw==='bold'||fw==='bolder'||parseInt(fw)>=600; nb=(bd&&(b==='y'||b==='r'))?b:bd; }
    else if(tag==='B'||tag==='STRONG'||/^H[1-6]$/.test(tag)){ if(b!=='y'&&b!=='r') nb=true; }
    { const bg=n.style&&n.style.backgroundColor; let col=n.style&&n.style.color; if(!col&&tag==='FONT') col=n.getAttribute('color');
      if(tag==='MARK'||(bg&&bg!=='transparent'&&!/rgba\(.*,\s*0\)/.test(bg))) nb='y'; else if(col&&isRed(col)) nb='r'; }

  }

  while(lines.length && !lines[lines.length-1].length) lines.pop();

  if(dl){ try{ await dl.save({filename:name,data:blob}); toast('저장 완료'); }catch(e){ if(e&&e.code==='declined') return; toast('저장 실패'); } return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast(name+' 저장'); }
function updZipTip(){ const n=esc(issueNo()); const L=lastLayout;
  $('#zipTip').innerHTML=`<div class="zn">${esc(zipName(issueNo()))}</div>
  <div class="zr"><span>img_gomin_mid_${n}.jpg</span><span>${W}×${L?L.H:''}px</span></div>
  <div class="zr"><span>${esc(workFileName(issueNo()))}</span><span>작업파일</span></div>`; }
$('#btnZip').onclick=async()=>{
  if(!await preflight()) return; toast('이미지 생성 중…');
  const files=await buildFiles(); const zip=new JSZip(); for(const f of files) zip.file(f.path,f.blob);
  zip.file(workFileName(issueNo()),JSON.stringify(packWork(),null,1));
  const blob=await zip.generateAsync({type:'blob'}); await saveBlob(zipName(issueNo()),blob);
  toast('jpg 이미지 '+(files[0].blob.size/1024/1024).toFixed(2)+'MB');
};
