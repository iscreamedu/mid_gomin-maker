<style>:root{--teal:#2cbdc2;--teal2:#d6f3f4;--tealD:#1c9a9f;--line:#dfe8e9;--bg:#f2f6f6;--ink:#222a2b;--muted:#7f8c8d}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header.top{min-height:56px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}

<header class="top">
  <h1>홈런 중등 고민있어요 제작 도구</h1>

const probe=document.createElement('canvas').getContext('2d');
function hasFont(name,weight){ const t='가나다ABCabc123한글',w=weight||400;
  probe.font=`${w} 40px "${name}", monospace`; const a=probe.measureText(t).width;
  probe.font=`${w} 40px "${name}", serif`; const b=probe.measureText(t).width; return a===b; }
const fontState={title:false,light:false,bold:false,reg:false,xb:false};
const NH_LIGHT=['NanumHuman Light','NanumHuman-Light','NanumHumanLight','나눔휴먼 Light','나눔휴먼 L','NanumHuman TTF Light','NanumHumanTTF Light','NanumHumanTTF-Light','NanumHuman L','NanumHuman-L'];
const NH_BOLD=['NanumHuman Bold','NanumHuman-Bold','NanumHumanBold','나눔휴먼 Bold','나눔휴먼 B','NanumHuman TTF Bold','NanumHumanTTF Bold','NanumHumanTTF-Bold','NanumHuman ExtraBold','NanumHuman B','NanumHuman-B'];
const NH_REG=['NanumHuman Regular','NanumHuman-Regular','NanumHumanRegular','나눔휴먼 Regular','나눔휴먼','NanumHuman TTF','NanumHumanTTF','NanumHuman TTF Regular','NanumHumanTTF Regular','NanumHuman'];

async function tryLocal(names,alias,weight){ for(const n of names){ try{ const f=new FontFace(alias,`local("${n}")`,{weight:String(weight)}); await f.load(); document.fonts.add(f); return true; }catch(e){} } return false; }
async function detectFonts(){
  fontState.title=hasFont('KoreanSWGIG4R',400)||await tryLocal(NH_TITLE,'KoreanSWGIG4R',400);
  fontState.light=hasFont('NanumHuman Light',300)||await tryLocal(NH_LIGHT,'NanumHuman Light',300);

// 사용자가 불러온 폰트 파일을 IndexedDB에 보관
const FDB={ open(){ return new Promise((res,rej)=>{ const r=indexedDB.open('gomin-mid-fonts',1); r.onupgradeneeded=()=>r.result.createObjectStore('f'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async put(k,v){ try{ const d=await this.open(); await new Promise((res,rej)=>{ const t=d.transaction('f','readwrite'); t.objectStore('f').put(v,k); t.oncomplete=res; t.onerror=rej; }); }catch(e){} },
  async all(){ try{ const d=await this.open(); return await new Promise((res,rej)=>{ const o={}, t=d.transaction('f'); const c=t.objectStore('f').openCursor(); c.onsuccess=()=>{ const cur=c.result; if(cur){ o[cur.key]=cur.value; cur.continue(); } else res(o); }; c.onerror=rej; }); }catch(e){ return {}; } } };
function fontSpec(name){ const n=name.toLowerCase();
  if(/swgig/.test(n)) return {family:'KoreanSWGIG4R',weight:'400',key:'title'};
  if(/human|휴먼/.test(n)){ if(/extra|xbold|_eb\b|-eb\b/.test(n)) return {family:'NanumHuman ExtraBold',weight:'800',key:'xb'};
    if(/light/.test(n)) return {family:'NanumHuman Light',weight:'300',key:'light'};
    if(/bold|_b\b|-b\b/.test(n)) return {family:'NanumHuman',weight:'700',key:'bold'};
    return {family:'NanumHuman Regular',weight:'400',key:'reg'}; }
  return null; }
async function registerFont(name,buf){ const sp=fontSpec(name); if(!sp) return null;
  const ff=new FontFace(sp.family,buf.slice(0),{weight:sp.weight}); await ff.load(); document.fonts.add(ff); return sp; }
async function loadSavedFonts(){ const all=await FDB.all(); for(const [k,v] of Object.entries(all)){ try{ await registerFont(k,v); }catch(e){} } }

function isRed(c){ let r,g,b,m; if((m=c.match(/rgba?\((\d+)[ ,]+(\d+)[ ,]+(\d+)/))){ r=+m[1];g=+m[2];b=+m[3]; } else if((m=c.match(/^#([0-9a-f]{6})$/i))){ const v=parseInt(m[1],16); r=v>>16;g=(v>>8)&255;b=v&255; } else if(/^red$/i.test(c)) return true; else return false; return r>190&&g<120&&b<120; }
const SKIP=/^(STYLE|SCRIPT|META|TITLE|HEAD|XML|O:P|LINK)$/;
function htmlToLines(root, fromPaste){
  const lines=[[]]; const cur=()=>lines[lines.length-1]; const nl=()=>lines.push([]);
  function walk(n,b){
    if(n.nodeType===3){
      let t=n.nodeValue;
      if(fromPaste){ t=t.replace(/[\r\n\t ]+/g,' '); if(!t.trim() && !cur().length) return; }
      t.split('\n').forEach((p,i)=>{ if(i>0) nl(); if(p) cur().push({t:p.replace(/ /g,' ').replace(/​/g,''),b}); });
      return;
    }
    if(n.nodeType!==1) return;
    const tag=n.tagName.toUpperCase();
    if(SKIP.test(tag)) return;
    if(tag==='BR'){ nl(); return; }
    const block=/^(DIV|P|LI|H[1-6]|TR|BLOCKQUOTE|SECTION|ARTICLE|UL|OL|TABLE)$/.test(tag);
    let nb=b; const fw=n.style&&n.style.fontWeight;

(function(){ const d=$('#helpDim'); const open=()=>{ d.classList.add('on'); d.querySelector('.hmb').scrollTop=0; }, close=()=>d.classList.remove('on');
