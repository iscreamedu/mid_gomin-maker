    else if(tag==='B'||tag==='STRONG'||/^H[1-6]$/.test(tag)){ if(b!=='y'&&b!=='r') nb=true; }
    { const bg=n.style&&n.style.backgroundColor; let col=n.style&&n.style.color; if(!col&&tag==='FONT') col=n.getAttribute('color');
